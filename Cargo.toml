[workspace]
resolver = "3"
members = ["crates/rvnc-proto", "crates/rvnc-client", "crates/rvnc-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
rvnc-proto = { path = "crates/rvnc-proto" }
rvnc-client = { path = "crates/rvnc-client" }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
winit = "0.30"
softbuffer = "0.4"
png = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
